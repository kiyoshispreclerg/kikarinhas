# Kikarinhas: arquivo de configuração de exemplo.
#
# Copie para ~/.config/kikarinhas/kikarinhas.ini (ou use o kikarinhas-config).
# Tudo é opcional: o que estiver comentado usa o valor padrão mostrado.
# As opções da linha de comando valem por cima deste arquivo.
#
# Para aplicar sem fechar o programa: kikarinhas --reload (ou kill -HUP).
# Tamanho, modo, escala, chão, avatares fixos, pastas de avatares,
# arquivo de pessoas e socket só mudam reiniciando.

[window]
# obs: janela comum para o OBS capturar (Xcomposite, com transparência).
# desktop: sobreposição em tela cheia; o clique atravessa.
#mode = obs
#size = 1280x720
#fps = 30

[avatars]
#scale = 2
# Pixels entre o chão e a borda de baixo; auto deixa espaço para o nome.
#ground = auto
# Avatares sorteados fora do chat; auto = 6 sem chat, 0 com chat.
#count = auto
# Avatares que aparecem sempre, separados por vírgula.
#show = pikachu, crewmate
# Avatar de todo mundo do chat (vazio: um sorteado por pessoa, sempre o mesmo).
#default =
# Pasta "data" do Stream Avatars (vazio: procura nas bibliotecas do Steam;
# off: não usa o Stream Avatars).
#sa_dir =
# Outras pastas de avatares, separadas por vírgula. Cada uma pode ter uma
# pasta de dados (streamavatars_json.txt), um pacote (data.txt) ou subpastas
# com eles. ~/.local/share/kikarinhas/avatars é lida sempre, antes destas; o
# Stream Avatars vem depois. Com nome repetido, vale a primeira.
#paths = ~/meus-avatares, ~/kits/outro
# Nome embaixo (ou em cima) de cada avatar.
#show_names = yes
#name_position = below
# Mostrar o nome só com atividade (chegada, mensagem, comando, balão): depois
# desses segundos em silêncio fica só o desenho. É independente do tempo para
# o avatar sair da tela ([chat] despawn).
#name_idle_hide = no
#name_idle_seconds = 30
# Balão com a mensagem de quem fala no chat.
#show_bubbles = yes
# Segundos que o balão de uma mensagem fica na tela; auto: de 4 a 12 s,
# conforme o tamanho do texto.
#bubble_seconds = auto
# Fonte (família e estilo do Pango) e tamanho em pontos do nome e do balão.
# O nome só muda reiniciando; o balão, nos próximos balões.
#name_font = Sans Bold
#name_size = 11
#bubble_font = Sans
#bubble_size = 10

[chat]
# Link da live ou do canal, @handle ou id do vídeo. Várias lives ao mesmo
# tempo: separe por vírgula (vale também para as outras plataformas, e
# todas somam).
#youtube = @SeuCanal, https://www.youtube.com/watch?v=ID
# Canal da Twitch (nome ou link twitch.tv/canal); lê o chat sem login.
#twitch = seucanal, outrocanal
# Canal do Kick (nome ou link kick.com/canal); lê o chat sem login.
#kick = seucanal
# Odysee: link da live ou do canal, @canal ou id da live; com um canal,
# espera ele entrar ao vivo (e segue para a live nova quando ela muda).
#odysee = @SeuCanal
# Emotes do BTTV, FFZ e 7TV na Twitch e do 7TV no Kick (viram imagem no
# emote wall).
#third_party_emotes = yes
# Chat de mentira, para testar sem live.
#demo = no
# Avatares do chat ao mesmo tempo e segundos em silêncio até sair.
#max = 30
#despawn = 300
# Mostra as mensagens no terminal.
#verbose = no
# Onde ficam as escolhas de cada pessoa.
#users = ~/.local/share/kikarinhas/users.tsv

[control]
# Socket unix para bridges e para o configurador; "off" desliga.
#socket = /run/user/1000/kikarinhas.sock

[commands]
# "!pikachu", "!azul": nome de avatar, acessório ou paleta direto.
#shortcuts = yes
#shortcut_cooldown = 5
# Pontos que o atalho custa (veja [points]).
#shortcut_cost = 0
# !ajuda (!comandos, !help): um balão azul sobre o avatar de quem pediu, com
# alguns comandos sorteados entre os que essa pessoa pode usar (os sons
# entram, um por um). Cada pedido sorteia de novo. Aparece mesmo com
# show_bubbles = no; help_bubbles = no desliga o balão.
#help_bubbles = yes
#help_count = 3
# Segundos do balão de ajuda; auto: 4 s mais 1,5 s por comando.
#help_seconds = auto

# Cada comando pode ser mudado numa seção [command.NOME]. As chaves:
#   aliases          outras palavras (substitui a lista padrão)
#   cooldown         segundos de espera por pessoa
#   global_cooldown  segundos de espera para todo mundo
#   role             nível mínimo: anyone, member, trusted, mod ou owner
#                    (trusted = marcado como confiável na aba Espectadores
#                    do kikarinhas-config; fica acima de member)
#   enabled          no desliga o comando
#   action           o que um comando novo faz (veja o fim do arquivo)
#   data             argumento fixo; vazio, vale o que a pessoa digitou
#   seconds          quanto tempo o balão (ou a imagem) fica; auto ou segundos
#   x, y, scale      só para action = image: centro em % da janela e tamanho
#                    em % da imagem
#   cost             pontos que o comando custa (veja [points])
#
# Comentários ficam em linhas próprias, nunca depois de um valor.
#
# Comandos padrão: avatar, color, gear, jump, sit, dance, emote, hug,
# attack, sound, help, song (a música tocando no computador; data = spotify
# limita aos players com "spotify" no nome), points, give, award (só mods) e
# top. O dono do canal nunca espera.

#[command.dance]
#aliases = danca, dança, baila
#cooldown = 30

#[command.attack]
#role = member

#[command.hug]
#enabled = no

# Comando novo: !buzina toca o som "buzina" da mesa de som.
# Ações: avatar, color, gear, jump, sit, dance, emote, hug, attack, sound, help,
# text, image, nowplaying, points, give, award, top.
#[command.buzina]
#action = sound
#data = buzina
#cooldown = 60
#global_cooldown = 10

# Atalho: !pika vira o avatar pikachu.
#[command.pika]
#action = avatar
#data = pikachu

# Texto fixo num balão sobre o avatar de quem pediu (para links, regras...).
# \n quebra a linha; {name} vira o nome de quem pediu. seconds: quanto tempo
# o balão fica (auto: pelo tamanho do texto).
#[command.discord]
#action = text
#data = Oi, {name}! Entre no Discord:\ndiscord.gg/exemplo
#aliases = dc
#seconds = 10

# Imagem na tela: PNG, JPEG, GIF (animado também) ou BMP; caminho relativo é
# a partir desta pasta. x e y: onde fica o centro, em % da janela (50 = meio);
# scale: % do tamanho da imagem; seconds: quanto tempo fica (padrão 5).
#[command.logo]
#action = image
#data = ~/imagens/logo.png
#x = 80
#y = 20
#scale = 50
#seconds = 8

# Cenário: imagens fixas na janela (PNG, JPEG, GIF animado ou BMP). x e y:
# centro em % da janela; scale: % do arquivo; layer: behind (atrás dos
# avatares, padrão) ou front (na frente). Até 16.
#[scenery.grama]
#file = ~/imagens/grama.png
#x = 50
#y = 94
#scale = 100
#layer = behind
#enabled = yes

[soundboard]
# Mesa de som: !som NOME (ou !sound, !play, !sfx), e também !NOME de cada
# som com commands = yes. A espera é a do comando sound (30 s por pessoa,
# 3 s para todos), compartilhada entre todos os sons.
#enabled = yes
# Volume geral, em %.
#volume = 100
# Saída ALSA; vazio usa a padrão (o PipeWire ou o PulseAudio, se houver).
#device = default
# Quantos sons ao mesmo tempo; passando disso, o mais antigo para.
#voices = 8
#commands = yes

[points]
# Pontos dos espectadores, guardados no arquivo de pessoas. Ganha (0 desliga
# cada forma): message por mensagem (no máximo uma vez a cada
# message_cooldown segundos), watch a cada watch_minutes com o avatar na
# tela, arrival na primeira mensagem da sessão, paid por Super Chat/bits,
# member por membro/inscrito novo; quem nunca apareceu começa com start.
# Gasta: cost em cada [command.NOME] e [sound.NOME] (o som sem cost custa o
# mesmo que o comando sound) e shortcut_cost em [commands]. O dono nunca paga.
# !pontos, !doar @nome N, !premiar @nome N (mods) e !ranking.
#enabled = yes
#name = pontos
#start = 0
#message = 1
#message_cooldown = 30
#watch = 5
#watch_minutes = 5
#arrival = 10
#paid = 100
#member = 100
# Cada estrela pega no !spawn (uma gema vale o triplo).
#catch = 5
# Apostas do !slots e do !bet, em pontos (max_bet = 0: sem limite), e quantos
# segundos uma rodada da roleta recebe apostas antes de girar.
#min_bet = 5
#max_bet = 5000
#roulette_seconds = 20

# Timers: um comando que roda sozinho quando todas as condições preenchidas
# valem: minutes desde a última vez, messages no chat desde então, e só com
# viewers pessoas do chat na tela. minutes ou messages é obrigatório. Roda
# como o dono do canal (sem espera, sem custo).
#[timer.logo]
#command = !logo
#minutes = 15
#messages = 0
#viewers = 0
#enabled = yes

[emote_wall]
# Emojis e emotes do chat voando pela tela. Emojis comuns saem da fonte de
# emoji colorido (Noto Color Emoji); emotes de membros do YouTube são
# baixados e guardados em ~/.cache/kikarinhas/emotes.
#enabled = yes
# Segundos de cada emoji na tela.
#duration = 5
# Tamanho, em pixels.
#size = 48
# rise: sobem em ondas; bounce: diagonal quicando nas bordas (o logo do
# DVD); fly: atravessam a tela de uma borda à outra.
#style = rise
# Quando sobem: uma mensagem com pelo menos min_per_message emojis manda
# todos; ou o mesmo emoji em combo_count mensagens dentro de combo_window
# segundos começa um combo (e cada mensagem com ele durante o combo também
# sobe). Basta uma das regras; 0 desliga a regra, e com as duas em 0 todo
# emoji sobe.
#min_per_message = 3
#combo_count = 3
#combo_window = 10
#max_per_message = 10
#max_on_screen = 150
# Reações do YouTube (os corações flutuantes): um ícone a cada
# reactions_per_icon reações.
#reactions = yes
#reactions_per_icon = 1
# Nunca mostrar: emojis, atalhos (:_oi:) ou nomes de emote, separados por
# vírgula.
#blacklist = 🍆, :_spam:

[danmaku]
# Mensagens do chat atravessando a tela da direita para a esquerda, só o
# texto, numa altura sorteada (como no Niconico). Ligado, as mensagens não
# ganham balão; a ajuda e os comandos de texto continuam com balão.
#enabled = no
# Segundos para atravessar a tela (as compridas andam mais rápido).
#seconds = 8
# Família e estilo do Pango, e tamanho em pontos.
#font = Sans Bold
#size = 24
# Cores: #rrggbb.
#color = #ffffff
#outline = #000000
#paid_color = #ffd24a
#member_color = #8ef09c
# Em %, de 10 a 100.
#opacity = 100
# Entre as linhas livres, prefere as que menos cruzam os avatares.
#avoid_avatars = yes
# Passando disso, mensagens novas não aparecem até sobrar espaço.
#max_on_screen = 100

[chat_window]
# Janela de chat clássico: o chat de todas as lives numa lista, para ler e
# para o OBS capturar (janela "Kikarinhas — chat") no lugar do chat em
# browser source. Também abre com Shift+C na janela principal, pelo
# kikarinhas-config, pelo socket
# ({"type":"chat_window","action":"show"}) e com --chat-window; fecha no X.
#open = no
#size = 400x600
#resizable = yes
# Sempre por cima das outras janelas.
#above = no
# own: as cores e a fonte abaixo; bubbles: cada mensagem num balão, como os
# dos avatares (usa a fonte dos balões).
#style = own
#font = Sans
#font_size = 14
#text_color = #ffffff
#name_color = #ffffff
# Dono, moderadores e membros com as cores das plaquinhas de nome.
#badge_colors = yes
# Contorno do texto, em pixels (0: sem); ajuda no fundo transparente.
#outline = #000000
#outline_width = 2
#paid_color = #ffd24a
#member_color = #8ef09c
# transparent, color (background_color, #rrggbbaa) ou image
# (background_image, esticada ou repetida: background_mode = stretch|tile).
#background = transparent
#background_color = #00000080
#background_image = ~/imagens/fundo-chat.png
#background_mode = stretch
# Letra da plataforma (Y, T, K, O) e hora antes do nome.
#show_platform = yes
#show_time = no
# Esconde os comandos (!dance...) e as mensagens destas pessoas (bots).
#hide_commands = yes
#hide_users = Nightbot, StreamElements
# Segundos até a mensagem sumir (0: nunca); rolando para trás, todas voltam.
#fade = 0
# Onde entram as novas: bottom ou top.
#newest = bottom
# Mensagens guardadas (também com a janela fechada).
#history = 200

[highlight]
# Comentário em destaque: clique numa mensagem da janela de chat e ela
# aparece grande no palco, num cartão, com um holofote no avatar de quem
# escreveu (que volta se tinha saído); clique de novo para tirar. Também pelo
# socket: {"type":"highlight","id":N} ou {"type":"highlight","clear":true}.
#card = yes
# Centro do cartão, em % da janela, e a largura máxima (% da largura).
#x = 50
#y = 25
#width = 50
#font = Sans
#font_size = 18
# Segundos até sumir sozinho (0: só clicando de novo).
#seconds = 0
#spotlight = yes

[questions]
# Fila de perguntas: o chat manda com !pergunta TEXTO e o streamer vai
# destacando no palco pela aba Perguntas do kikarinhas-config (a lista não
# vai para a live). auto: mensagens terminadas em "?" também entram.
#auto = no
#max = 50

# Um som por seção. file: wav, ogg ou mp3 (caminho relativo é a partir desta
# pasta). volume: de 0 a 400%, para nivelar sons estourados ou baixinhos (o
# botão "Nivelar" do kikarinhas-config calcula sozinho).
#[sound.buzina]
#file = ~/sons/buzina.ogg
#aliases = buz, corneta
#volume = 80
