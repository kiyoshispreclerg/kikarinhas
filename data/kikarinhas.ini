# Kikarinhas: arquivo de configuração de exemplo.
#
# Copie para ~/.config/kikarinhas/kikarinhas.ini (ou use o kikarinhas-config).
# Tudo é opcional: o que estiver comentado usa o valor padrão mostrado.
# As opções da linha de comando valem por cima deste arquivo.
#
# Para aplicar sem fechar o programa: kikarinhas --reload (ou kill -HUP).
# Tamanho, modo, escala, chão, avatares fixos, pasta do Stream Avatars,
# arquivo de pessoas e socket só mudam reiniciando.

[window]
# obs: janela comum para o OBS capturar (Xcomposite, com transparência).
# desktop: sobreposição em tela cheia; o clique atravessa.
#mode = obs
#size = 1280x720
#fps = 30

[avatars]
#scale = 2
# Pixels entre o chão e a borda de baixo; auto deixa espaço para o nome.
#ground = auto
# Avatares sorteados fora do chat; auto = 6 sem chat, 0 com chat.
#count = auto
# Avatares que aparecem sempre, separados por vírgula.
#show = pikachu, crewmate
# Avatar de todo mundo do chat (vazio: um sorteado por pessoa, sempre o mesmo).
#default =
# Pasta "data" do Stream Avatars (vazio: procura nas bibliotecas do Steam).
#sa_dir =
# Nome embaixo (ou em cima) de cada avatar.
#show_names = yes
#name_position = below
# Balão com a mensagem de quem fala no chat.
#show_bubbles = yes
# Fonte (família e estilo do Pango) e tamanho em pontos do nome e do balão.
# O nome só muda reiniciando; o balão, nos próximos balões.
#name_font = Sans Bold
#name_size = 11
#bubble_font = Sans
#bubble_size = 10

[chat]
# Link da live ou do canal, @handle ou id do vídeo.
#youtube = @SeuCanal
# Chat de mentira, para testar sem live.
#demo = no
# Avatares do chat ao mesmo tempo e segundos em silêncio até sair.
#max = 30
#despawn = 300
# Mostra as mensagens no terminal.
#verbose = no
# Onde ficam as escolhas de cada pessoa.
#users = ~/.local/share/kikarinhas/users.tsv

[control]
# Socket unix para bridges e para o configurador; "off" desliga.
#socket = /run/user/1000/kikarinhas.sock

[commands]
# "!pikachu", "!azul": nome de avatar, acessório ou paleta direto.
#shortcuts = yes
#shortcut_cooldown = 5
# !ajuda (!comandos, !help): um balão azul sobre o avatar de quem pediu, com
# alguns comandos sorteados entre os que essa pessoa pode usar (os sons
# entram, um por um). Cada pedido sorteia de novo. Aparece mesmo com
# show_bubbles = no; help_bubbles = no desliga o balão.
#help_bubbles = yes
#help_count = 3

# Cada comando pode ser mudado numa seção [command.NOME]. As chaves:
#   aliases          outras palavras (substitui a lista padrão)
#   cooldown         segundos de espera por pessoa
#   global_cooldown  segundos de espera para todo mundo
#   role             quem pode usar: anyone, member, mod ou owner
#   enabled          no desliga o comando
#   action           o que um comando novo faz (veja o fim do arquivo)
#   data             argumento fixo; vazio, vale o que a pessoa digitou
#
# Comentários ficam em linhas próprias, nunca depois de um valor.
#
# Comandos padrão: avatar, color, gear, jump, sit, dance, emote, hug,
# attack, sound e help. O dono do canal nunca espera.

#[command.dance]
#aliases = danca, dança, baila
#cooldown = 30

#[command.attack]
#role = member

#[command.hug]
#enabled = no

# Comando novo: !buzina toca o som "buzina" da mesa de som.
# Ações: avatar, color, gear, jump, sit, dance, emote, hug, attack, sound, help.
#[command.buzina]
#action = sound
#data = buzina
#cooldown = 60
#global_cooldown = 10

# Atalho: !pika vira o avatar pikachu.
#[command.pika]
#action = avatar
#data = pikachu

[soundboard]
# Mesa de som: !som NOME (ou !sound, !play, !sfx), e também !NOME de cada
# som com commands = yes. A espera é a do comando sound (30 s por pessoa,
# 3 s para todos), compartilhada entre todos os sons.
#enabled = yes
# Volume geral, em %.
#volume = 100
# Saída ALSA; vazio usa a padrão (o PipeWire ou o PulseAudio, se houver).
#device = default
# Quantos sons ao mesmo tempo; passando disso, o mais antigo para.
#voices = 8
#commands = yes

# Um som por seção. file: wav, ogg ou mp3 (caminho relativo é a partir desta
# pasta). volume: de 0 a 400%, para nivelar sons estourados ou baixinhos (o
# botão "Nivelar" do kikarinhas-config calcula sozinho).
#[sound.buzina]
#file = ~/sons/buzina.ogg
#aliases = buz, corneta
#volume = 80
