name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DEPS: >-
    build-essential pkg-config gettext libx11-dev libxext-dev libcairo2-dev
    libpango1.0-dev libcurl4-openssl-dev libasound2-dev libssl-dev libgtk2.0-dev
    libdbus-1-dev

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS cppcheck
      - run: make lint

  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [test, asan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS
      - run: make ${{ matrix.target }}
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
      # The whole program, not only the unit tests: the fake chat for a few
      # seconds on a virtual X screen under ASan/UBSan (which abort on the
      # first error), then SIGTERM, which has to end in a clean exit and no
      # leaks (fontconfig's are suppressed).
      - name: Run the fake chat under ASan
        if: matrix.target == 'asan'
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-dejavu-core
          : > "$RUNNER_TEMP/users.tsv"
          : > "$RUNNER_TEMP/kikarinhas.ini"
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --preserve-status -s TERM 15 \
            build/asan/kikarinhas --demo-chat -c "$RUNNER_TEMP/kikarinhas.ini" \
            --users "$RUNNER_TEMP/users.tsv" --socket "$RUNNER_TEMP/kk.sock" -v
